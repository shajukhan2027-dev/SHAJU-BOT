us:50%;font-size:20px;z-index:10;cursor:pointer}</style></head><body><div class="bg"></div><div class="music" onclick="play()">🎵</div><div class="wrap"><img src="photo.jpg" class="pic"><div class="logo">SHAJU BOT</div><span class="live">● LIVE</span><p style="margin-top:8px;opacity:.8">Public WhatsApp Bot Portal • Online Now</p><div class="card"><h3>Enter Phone Number</h3><input id="num" placeholder="88017XXXXXXXXX"><button class="btn" onclick="getCode()">GET PAIRING CODE 🔗</button><div id="show" class="code"></div><p id="msg" style="font-size:13px;margin-top:10px;opacity:.8"></p></div><div class="feat"><div class="f">🛡️ Anti-Link</div><div class="f">✨ Welcome</div><div class="f">@ Tag All</div><div class="f">🎨 Sticker Maker</div></div><p style="margin-top:20px;font-size:12px;opacity:.6">Secure • Fast • 24/7 Active • Powered by SHAJU BOT</p></div><audio id="au" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio><script>for(let i=0;i<12;i++){let b=document.createElement('div');b.className='bubble';let s=Math.random()*40+10;b.style.width=s+'px';b.style.height=s+'px';b.style.left=Math.random()*100+'vw';b.style.animationDelay=Math.random()*5+'s';document.body.appendChild(b)}async function getCode(){let n=document.getElementById('num').value;if(n.length<10){alert('Sothik number dao bhai');return}document.getElementById('msg').innerText='Code antasi...';let r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:n})});let d=await r.json();let s=document.getElementById('show');s.style.display='block';s.innerText=d.code;document.getElementById('msg').innerText='WhatsApp > Linked Devices > Link with phone number e ei code boshau!'}function play(){let a=document.getElementById('au');a.paused?a.play():a.pause()}</script></body></html>
