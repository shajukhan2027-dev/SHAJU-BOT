<head>

<title>SHAJU BOT - Pair Your Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{overflow-x:hidden;background:#06281C}

/* ===== LIVE GLOW GRAM - BACKGROUND ===== */
.live-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#0B3D2E 0%,#14532D 35%,#1E6B3A 60%,#06281C 100%)}
.glow-sun{position:absolute;top:-50px;right:-20px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#FFF59D 0%,#FFEB3B 30%,#FFC107 55%,transparent 70%);filter:blur(2px);animation:sunGlow 4s ease-in-out infinite}
@keyframes sunGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.glow-cloud{position:absolute;height:28px;border-radius:50px;background:rgba(255,255,255,.9);filter:blur(8px);animation:cloudMove linear infinite}
@keyframes cloudMove{from{left:-200px}to{left:110%}}
.c1{top:60px;width:180px;animation-duration:40s}.c2{top:110px;width:120px;animation-duration:55s;opacity:.6}.c3{top:30px;width:90px;animation-duration:30s;opacity:.5}
.firefly{position:absolute;width:6px;height:6px;border-radius:50%;background:#FFFF00;box-shadow:0 0 15px 6px #FFFF00;animation:flyFly linear infinite}
@keyframes flyFly{0%{transform:translate(0,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(200px,-80px);opacity:0}}
.f1{top:250px;left:10%;animation-duration:6s}.f2{top:320px;left:70%;animation-duration:8s;animation-delay:1s}.f3{top:200px;left:50%;animation-duration:5s;animation-delay:2s}.f4{top:350px;left:30%;animation-duration:7s;animation-delay:.5s}.f5{top:280px;left:85%;animation-duration:9s;animation-delay:1.5s}
.tree-css{position:absolute;bottom:120px;width:10px;height:90px;background:#4A2C1A;border-radius:5px}
.tree-css::before{content:'';position:absolute;top:-70px;left:-45px;width:100px;height:90px;border-radius:50%;background:radial-gradient(circle,#66BB6A,#2E7D32);box-shadow:0 0 30px #4CAF50;animation:leafGlow 3s infinite}
@keyframes leafGlow{0%,100%{box-shadow:0 0 20px #4CAF50}50%{box-shadow:0 0 45px #81C784}}
.t-left{left:5%}.t-right{right:5%;transform:scale(.8)}
.house-css{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);width:140px;height:100px;background:linear-gradient(#8D6E63,#6D4C41);border-radius:8px 8px 0 0;box-shadow:0 0 40px rgba(255,193,7,.4)}
.house-css::before{content:'';position:absolute;top:-45px;left:-10px;width:160px;height:50px;background:#5D4037;clip-path:polygon(50% 0,100% 100%,0 100%)}
.house-css::after{content:'';position:absolute;top:35px;left:50px;width:35px;height:45px;background:#FFEB3B;box-shadow:0 0 25px #FFEB3B;animation:windowGlow 2s infinite;border-radius:3px}
@keyframes windowGlow{0%,100%{box-shadow:0 0 15px #FFEB3B}50%{box-shadow:0 0 35px #FFEB3B}}
.river-glow{position:absolute;bottom:0;left:0;width:100%;height:120px;background:linear-gradient(90deg,#0D47A1,#1565C0,#00BCD4,#1565C0,#0D47A1);background-size:300% 100%;animation:waterFlow 3s linear infinite;box-shadow:0 -5px 30px rgba(0,188,212,.6)}
@keyframes waterFlow{from{background-position:0% 0}to{background-position:300% 0}}
.river-shine{position:absolute;bottom:60px;left:0;width:100%;height:2px;background:rgba(255,255,255,.6);filter:blur(1px);animation:shineMove 2s linear infinite}
@keyframes shineMove{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ===== NEW HD DESIGN - SOB THIK ASE ===== */
.wrap{position:relative;z-index:10;padding:14px;padding-bottom:190px;max-width:480px;margin:0 auto}
.top-badge{text-align:center}
.top-badge span{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;padding:6px 14px;border-radius:20px;backdrop-filter:blur(10px)}
.hero{text-align:center;padding:16px 0 0}
.hero h1{font-size:42px;color:#fff;letter-spacing:1px;text-shadow:0 0 20px #FFEB3B,0 0 50px #4CAF50;line-height:1}
.hero h1 small{display:block;font-size:18px;color:#C8E6C9;letter-spacing:4px;margin-top:4px}
.hero p{font-size:12px;color:#E8F5E9;margin-top:10px;opacity:.9}
.profile-wrap{text-align:center;margin-top:16px;position:relative}
.profile{width:130px;height:130px;border-radius:50%;border:4px solid #fff;object-fit:cover;box-shadow:0 0 0 4px rgba(255,235,59,.3),0 0 40px #FFEB3B}
.profile-name{color:#fff;font-weight:bold;margin-top:8px;font-size:16px;text-shadow:0 2px 10px #000}
.profile-name span{font-weight:400;font-size:12px;opacity:.8;display:block}

.card{background:rgba(255,255,255,.97);border-radius:24px;padding:20px;margin-top:16px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.card h3{color:#1B5E20;text-align:center;font-size:20px}
.card p{font-size:12px;color:#777;text-align:center;margin-top:4px}
.inputbox{display:flex;align-items:center;border:2px solid #C8E6C9;border-radius:14px;padding:12px;margin-top:16px;background:#F1F8E9}
.inputbox:focus-within{border-color:#2E7D32;box-shadow:0 0 0 3px rgba(46,125,50,.15)}
.inputbox input{border:none;outline:none;width:100%;font-size:16px;margin-left:8px;background:transparent;font-weight:600}
.wa-icon{width:28px;height:28px}
.btn{width:100%;background:linear-gradient(90deg,#1B5E20,#2E7D32,#43A047);color:#fff;border:none;padding:15px;border-radius:14px;font-size:16px;font-weight:bold;margin-top:14px;cursor:pointer;box-shadow:0 8px 20px rgba(46,125,50,.4)}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#aaa;box-shadow:none}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:16px}
.steps div{font-size:10px;color:#666;background:#F1F8E9;padding:8px 2px;border-radius:10px}
.num{width:24px;height:24px;background:#2E7D32;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 5px;font-weight:bold}

.codebox{background:#fff;border-radius:20px;padding:16px;margin-top:12px;text-align:center;box-shadow:0 0 25px rgba(255,235,59,.5);border:2px dashed #A5D6A7}
.code{font-size:28px;letter-spacing:4px;background:#E8F5E9;padding:12px;border-radius:12px;color:#1B5E20;font-weight:900;margin-top:8px}
.status{background:rgba(255,255,255,.95);border-radius:14px;padding:14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.status b{color:#1B5E20}
.on{color:#2e7d32;font-weight:bold}
.about{background:rgba(255,255,255,.97);border-radius:24px;padding:18px;margin-top:12px}
.about h3{color:#1B5E20}
.about p{font-size:12px;color:#666;line-height:1.6;margin-top:8px}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmd{background:#F1F8E9;padding:12px;border-radius:14px;font-size:12px;border:1px solid #DCEDC8}
.cmd b{color:#1B5E20;font-size:13px}
.footer{text-align:center;color:#fff;font-weight:600;margin:18px 0 0;text-shadow:0 0 10px #4CAF50;font-size:13px}
</style>
</head>
