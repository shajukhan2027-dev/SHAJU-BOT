<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAJU BOT - Shopnopuri</title>
<style>
body{background:linear-gradient(180deg,#ff9de2,#7b2fff,#02150a);color:white;text-align:center;font-family:sans-serif;padding:15px}
img{width:160px;height:160px;border-radius:50%;border:5px solid #ffeb3b;object-fit:cover;box-shadow:0 0 25px #ffeb3b}
.box{background:#000000aa;padding:20px;border-radius:25px;margin-top:15px;border:2px solid #ff9de2}
input{width:92%;padding:15px;font-size:19px;border-radius:12px;border:2px solid #ffeb3b;background:#000;color:#fff;text-align:center}
button{width:96%;padding:15px;font-size:20px;font-weight:bold;background:linear-gradient(90deg,#ffeb3b,#ff4081);border:none;border-radius:12px;margin-top:15px;color:#000}
#codeDisplay{font-size:34px;color:#ffeb3b;font-weight:bold;margin-top:12px;letter-spacing:3px}
audio{width:100%;margin-top:10px}
</style></head>
<body>
<img src="PASTE_YOUR_PHOTO_LINK_HERE">
<h1>✨ SHAJU BOT ✨</h1>
<p>🌸 Amader Deshta Shopnopuri 🌸<br>Sathi Modher Phul Pori</p>
<audio controls autoplay loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>
<p>🎵 Gaan Bajer - Shopnopuri Song 🎵</p>
<div class="box">
<h2>Enter WhatsApp Number</h2>
<input id="num" placeholder="88017XXXXXXXXX" value="880">
<button onclick="getCode()">GET PAIRING CODE</button>
<div id="codeDisplay"></div>
<p>WhatsApp > Linked Devices > Link with phone number<br>Code ta 20 second er vitore boshau!</p>
</div>
<p>👑 Owner: Nationalist Shaju Khan | Dayamir, Sylhet</p>
<script>
async function getCode(){
 let num=document.getElementById('num').value;
 document.getElementById('codeDisplay').innerText="WAIT...";
 let res=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:num})});
 let data=await res.json();
 document.getElementById('codeDisplay').innerText=data.code;
}
</script></body></html>
