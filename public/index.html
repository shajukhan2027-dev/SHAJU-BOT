<script>
let canClick = true;
async function getCode(){
  if(!canClick) return;
  let n=document.getElementById('num').value.replace(/[^0-9]/g,'');
  if(n.length<10){document.getElementById('codeDisplay').innerText="INVALID NUMBER";return;}
  document.getElementById('codeDisplay').innerText="WAIT...";
  canClick = false;
  let btn = document.getElementById('pairBtn');
  btn.disabled = true;
  btn.innerText = "Wait 30 Sec...";
  setTimeout(()=>{ canClick=true; btn.disabled=false; btn.innerText="Get My Pair Code"; }, 30000);
  try{
    let r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:n})});
    let d=await r.json();
    document.getElementById('codeDisplay').innerText=d.code||d.error||"TRY AGAIN";
    if(d.code==="ALREADY LINKED") document.getElementById('codeHint').innerText="Bot Agei Link Ase! Group e .menu likho!";
    else document.getElementById('codeHint').innerText="Code paiso? Loge Loge WhatsApp e deo!";
  }catch(e){document.getElementById('codeDisplay').innerText="SERVER OFFLINE";}
}
</script>
